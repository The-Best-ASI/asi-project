# Konfiguracja projektu zespołu. Ten plik edytuje zespół (Sprint 1).
# Kontrakt datasetów prowadzącej jest w src/asi_project/datasets.yaml — tamtego pliku nie edytujemy.

# TODO (S1): id datasetu z docs/datasets.md, np. ai4i_2020.
dataset: bank_loan_status

# DONE (S1): typy cech po EDA. Wyłącznie kolumny z ALLOWED FEATURES wybranego datasetu.
features:
  numeric:
    - Current Loan Amount
    - Credit Score
    - Annual Income
    - Monthly Debt
    - Years of Credit History
    - Months since last delinquent
    - Number of Open Accounts
    - Number of Credit Problems
    - Current Credit Balance
    - Maximum Open Credit
    - Bankruptcies
    - Tax Liens
  categorical:
    - Term
    - Years in current job
    - Home Ownership
    - Purpose

split:
  test_size: 0.2
  random_state: 42

paths:
  ci_sample: data/01_raw/sample.csv
  metrics: metrics.json
