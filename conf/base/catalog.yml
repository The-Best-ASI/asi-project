# Data Catalog — wejścia i wyjścia pipeline'ów. Ścieżki względem katalogu głównego repo.
# Dane spoza katalogu (validated_data, normalized_data) Kedro trzyma tylko w pamięci.

# Pełne dane (poza gitem): python scripts/download_data.py
raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/bank_loan_status/credit_train.csv

# Wyjście data_processing: po input normalization i training-only filtering.
intermediate_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/intermediate.csv
  save_args:
    index: false

# Wyjście data_science: wytrenowany model
model:
  type: pickle.PickleDataset
  filepath: data/06_models/model.pkl

# Metryki ewaluacji modelu z pipeline'u data_science.
metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/metrics.json
  save_args:
    indent: 2
