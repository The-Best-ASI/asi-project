# Konfiguracja datesetu i kontraktu
dataset_id: "bank_loan_status"
target: "Loan Status"
positive_class: "Charged Off"
data_mode: "full"

# Parametry splitu
split:
  strategy: "stratified_random"
  test_size: 0.2
  random_state: 42

# Zadeklarowane cechy modelu (ALLOWED FEATURES)
features:
  numeric:
    - Current Loan Amount
    - Credit Score
    - Annual Income
    - Monthly Debt
    - Years of Credit History
    - Months since last delinquent
    - Number of Open Accounts
    - Number of Credit Problems
    - Current Credit Balance
    - Maximum Open Credit
    - Bankruptcies
    - Tax Liens
  categorical:
    - Term
    - Years in current job
    - Home Ownership
    - Purpose

# Hiperparametry modelu
model_params:
  random_state: 42
  max_iter: 1000
  solver: "liblinear"
  class_weight: "balanced"
