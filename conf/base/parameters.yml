# Konfiguracja datesetu i kontraktu
dataset_id: "bank_loan_status"
target: "Loan Status"
positive_class: "Charged Off"

data_mode: "full"

# Parametry splitu
split:
  strategy: "stratified_random"
  test_size: 0.2
  random_state: 42

# Zadeklarowane cechy modelu (ALLOWED FEATURES)
features:
  numeric:
    - Current Loan Amount
    - Credit Score
    - Annual Income
    - Monthly Debt
    - Years of Credit History
    - Months since last delinquent
    - Number of Open Accounts
    - Number of Credit Problems
    - Current Credit Balance
    - Maximum Open Credit
    - Bankruptcies
    - Tax Liens
  categorical:
    - Term
    - Years in current job
    - Home Ownership
    - Purpose

# Hiperparametry modelu
model_params:
  random_state: 42
  max_iter: 1000
  solver: "liblinear"
  class_weight: "balanced"

wandb:
  enabled: true
  project: "wb-baseline"
  entity: "the-best-asi"
  baseline_run_name: "baseline-logreg"

autogluon:
  enabled: true
  target_column: "Loan Status"
  positive_class: "Charged Off"
  eval_metric: "recall"
  save_path: "data/06_models/autogluon"
  configs:
    - name: "ag_fast_medium"
      presets: "medium_quality"
      time_limit: 60
      optimize_for_deployment: false
    - name: "ag_strong_deployment"
      presets: "good_quality"
      time_limit: 180
      optimize_for_deployment: true
